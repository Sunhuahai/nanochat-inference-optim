[project]
name = "nanochat-inference-optim"
version = "0.1.0"
description = "Small, interview-friendly inference optimizations for karpathy/nanochat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanochat_optim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
